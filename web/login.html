<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>Valorize Bot · Acceso</title>
<link rel="icon" href="/favicon.ico">
<style>
:root{--bg:#0b0e14;--panel:#121722;--line:#232b3b;--line2:#2c3547;--text:#e7eaf0;--text2:#a3abbb;--muted:#6c7589;--accent:#f5b83d}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);color:var(--text);font:15px/1.45 "Segoe UI",system-ui,-apple-system,Roboto,sans-serif}
body{display:grid;place-items:center;padding:16px;background:radial-gradient(800px 400px at 50% -10%,rgba(245,184,61,.08),transparent),var(--bg)}
.card{width:100%;max-width:380px;background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:28px 26px;box-shadow:0 24px 60px rgba(0,0,0,.45)}
.brand{display:flex;align-items:center;gap:10px;font-weight:650;font-size:18px;margin-bottom:22px}
.logo{width:34px;height:34px;border-radius:9px;background:linear-gradient(135deg,#f5b83d,#e08a1e);display:grid;place-items:center}
label{display:block;font-size:13px;color:var(--text2);font-weight:600;margin-bottom:6px}
input{width:100%;background:#0d1119;border:1px solid var(--line2);color:var(--text);border-radius:9px;padding:11px 12px;font-size:15px;font-family:inherit}
input:focus{outline:none;border-color:var(--accent)}
button{width:100%;margin-top:14px;border:0;background:var(--accent);color:#1a1305;font-family:inherit;font-weight:600;font-size:15px;padding:11px;border-radius:9px;cursor:pointer}
button:disabled{opacity:.6;cursor:wait}
.err{min-height:20px;margin-top:12px;font-size:13px;color:#ff9aa7}
.foot{margin-top:18px;font-size:12px;color:var(--muted);text-align:center}
</style>
</head>
<body>
<form class="card" id="f">
  <div class="brand"><div class="logo"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#1a1305" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M3 17l6-6 4 4 8-8"/><path d="M15 7h6v6"/></svg></div>Valorize Bot</div>
  <label for="pw">Contraseña</label>
  <input id="pw" type="password" autocomplete="current-password" autofocus required>
  <button id="b" type="submit">Entrar</button>
  <div class="err" id="err" role="alert"></div>
  <div class="foot">🔒 Conexión cifrada · acceso privado</div>
</form>
<script>
document.getElementById('f').addEventListener('submit', async ev=>{
  ev.preventDefault(); const b=document.getElementById('b'), err=document.getElementById('err');
  b.disabled=true; err.textContent='';
  try{
    const r = await fetch('/api/login',{method:'POST',headers:{'X-Panel':'1','Content-Type':'application/json'},
      body:JSON.stringify({password:document.getElementById('pw').value})});
    const j = await r.json().catch(()=>({}));
    if(r.ok && j.ok){ location.href='/'; return; }
    err.textContent = j.error || 'No se pudo iniciar sesión.';
  }catch(e){ err.textContent='Sin conexión con el servidor.'; }
  b.disabled=false; document.getElementById('pw').select();
});
</script>
</body>
</html>
